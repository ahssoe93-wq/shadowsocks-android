name: Build Debug APK

on:
  push:
    branches:
      - khp-rebrand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: jetbrains
        java-version: 21

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

    - name: Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

    - name: Cargo cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          core/src/main/rust/shadowsocks-rust/target
        key: cargo-${{ hashFiles('core/src/main/rust/shadowsocks-rust/Cargo.lock') }}

    - name: Build debug APK (arm64)
      run: ./gradlew :mobile:assembleDebug -PCARGO_PROFILE=debug -PTARGET_ABI=arm64

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: khp-ss-vpn-debug-apk
        path: mobile/build/outputs/apk/debug/*.apk
